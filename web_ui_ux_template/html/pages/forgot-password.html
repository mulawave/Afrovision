<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Premium Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../theme.css" />
</head>
<body>
  <div class="av-bg-orb av-bg-orb--orange" style="top: -200px; right: -250px;"></div>
  <div class="av-bg-orb av-bg-orb--blue" style="bottom: -150px; left: -200px;"></div>

  <div class="av-auth-wrapper">
    <div class="av-auth-card">
      <!-- Logo -->
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="display: inline-flex; align-items: center; gap: 0.5rem;">
          <div style="width: 36px; height: 36px; border-radius: var(--av-radius-sm); background: var(--av-gradient-cta); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem; color: var(--av-dark-blue);">A</div>
          <span style="font-size: 1.25rem; font-weight: 700;"><span style="color: var(--av-white);">Afro</span><span style="color: var(--av-orange);">Vision</span></span>
        </div>
      </div>

      <!-- Request Form -->
      <div id="requestView">
        <h1 class="av-heading-md" style="text-align: center;">Forgot your password?</h1>
        <p class="av-body av-mt-1" style="text-align: center;">Enter your email and we'll send a reset link.</p>

        <div id="fpBanner" class="av-banner av-banner--error av-mt-4" style="display: none;"></div>

        <form style="margin-top: 1.5rem;" onsubmit="return handleForgot(event)">
          <div class="av-input-group av-mb-6">
            <label for="email">Email</label>
            <input type="email" id="email" class="av-input" placeholder="you@example.com" required />
          </div>
          <button type="submit" class="av-btn av-w-full" id="fpBtn">Send Reset Link</button>
        </form>

        <p class="av-body-sm av-mt-6" style="text-align: center;">
          <a href="login.html" style="color: var(--av-orange); font-weight: 600;">← Back to Sign In</a>
        </p>
      </div>

      <!-- Success View (hidden by default) -->
      <div id="successView" style="display: none; text-align: center;">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(76,175,80,0.15); border: 2px solid var(--av-success); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 1.5rem;">✓</div>
        <h1 class="av-heading-md">Check your inbox</h1>
        <p class="av-body av-mt-2">If an account exists for <strong id="sentEmail" style="color: var(--av-orange);"></strong>, you'll receive a password reset link shortly.</p>
        <a href="login.html" class="av-btn av-w-full" style="display: inline-flex; margin-top: 2rem; text-decoration: none;">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="../theme.js"></script>
  <script>
    function handleForgot(e) {
      e.preventDefault();
      var btn = document.getElementById('fpBtn');
      var banner = document.getElementById('fpBanner');
      var email = document.getElementById('email').value;

      banner.style.display = 'none';

      if (!email) {
        banner.textContent = 'Please enter your email address.';
        banner.style.display = 'block';
        return false;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="av-spinner av-spinner--sm"></span> Sending…';

      setTimeout(function() {
        document.getElementById('requestView').style.display = 'none';
        document.getElementById('sentEmail').textContent = email;
        document.getElementById('successView').style.display = 'block';
      }, 1500);

      return false;
    }
  </script>
</body>
</html>
